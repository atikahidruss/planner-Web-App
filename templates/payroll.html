<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll</title>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
        }

        h1 {
            font-family: 'Shrikhand', sans-serif;
            text-align: center;
            font-size: 2em;
            color: #5f4b8b;
        }

        .payroll-form {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            background-color: #5f4b8b;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #452774;
        }
    </style>
</head>
<body>
    <h1>Payroll Calculation</h1>

    <!-- Payroll Form -->
    <form class="payroll-form" method="POST">
        <div class="form-group">
            <label for="name">Employee Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <input type="text" id="role" name="role" required>
        </div>
        <div class="form-group">
            <label for="total_days">Total Days in Month</label>
            <input type="number" id="total_days" name="total_days" required>
        </div>
        <div class="form-group">
            <label for="weekends">Weekends</label>
            <input type="number" id="weekends" name="weekends" required>
        </div>
        <div class="form-group">
            <label for="holidays">Holidays</label>
            <input type="number" id="holidays" name="holidays" required>
        </div>

        <button type="submit" class="btn">Calculate Salary</button>
    </form>

    {% if salary %}
    <div class="result">
        <p>Total Working Days: {{ total_working_days }}</p>
        <p>Salary: RM {{ salary }}</p>
    </div>
    {% endif %}

    <br>
    <!-- Button to go to Calendar -->
    <a href="/holidays"><button class="btn">Go to Calendar</button></a>
</body>
</html>
